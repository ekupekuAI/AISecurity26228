<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustVision</title>
    <meta name="description" content="Air-gapped assurance and inspection layer for computer-vision datasets, model checkpoints, inference provenance and distribution shift. SIH 2026 PS SIH26228." />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      AIR-GAP POLICY: this document must never reference an external origin.
      Fonts are vendored under /fonts. The CSP in server/middleware/securityHeaders.ts
      enforces default-src 'self' so any regression fails closed at the browser.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Installable PWA: same-origin manifest, icons and theme. No external origin. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrustVision" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This console requires JavaScript. It runs entirely on the local node; no external
      network access is performed at any point.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
