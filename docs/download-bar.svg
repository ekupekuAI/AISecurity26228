<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="1000" height="84" role="img" aria-label="Download the offline TrustVision Windows app from the Releases page">
  <defs>
    <linearGradient id="dlbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="dlsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dlround"><rect x="1" y="1" width="998" height="82" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#dlround)">
    <rect x="0" y="0" width="1000" height="84" fill="url(#dlbg)"/>

    <!-- sheen sweeping across the bar -->
    <rect x="-280" y="0" width="280" height="84" fill="url(#dlsheen)">
      <animate attributeName="x" from="-280" to="1000" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- animated download badge -->
    <g transform="translate(54,42)">
      <circle r="27" fill="#ffffff" fill-opacity="0.12"/>
      <circle r="27" fill="none" stroke="#ffffff" stroke-width="1.6">
        <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="2s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g>
          <line x1="0" y1="-12" x2="0" y2="7"/>
          <polyline points="-8,-1 0,8 8,-1"/>
          <animateTransform attributeName="transform" type="translate" values="0 -3;0 4;0 -3" dur="1.4s" repeatCount="indefinite"/>
        </g>
        <line x1="-11" y1="15" x2="11" y2="15"/>
      </g>
    </g>

    <!-- message -->
    <text x="102" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Download the TrustVision Windows App</text>
    <text x="102" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#dbe3ff">Runs fully offline &#183; zero install &#183; double-click and go &#183; grab it from Releases</text>

    <!-- pulsing call-to-action pill -->
    <g transform="translate(858,42)">
      <rect x="-92" y="-25" width="184" height="50" rx="25" fill="none" stroke="#ffffff" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0;0.55;0" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-84" y="-19" width="168" height="38" rx="19" fill="#ffffff"/>
      <text x="-16" y="5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3730a3">Releases</text>
      <g stroke="#3730a3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g>
          <line x1="52" y1="-6" x2="52" y2="6"/>
          <polyline points="47,1 52,7 57,1"/>
          <animateTransform attributeName="transform" type="translate" values="0 -2;0 3;0 -2" dur="1.4s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="82" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
</svg>
