<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="TrustVision — computer-vision integrity assurance, verified offline. SIH 2026, problem statement SIH26228.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a6c4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip"><rect x="880" y="78" width="236" height="224" rx="10"/></clipPath>
    <style>
      .title   { font: 800 72px "Segoe UI", "Helvetica Neue", system-ui, -apple-system, sans-serif; fill: #eef3fd; letter-spacing: -1.5px; }
      .tag     { font: 500 22px "Segoe UI", "Helvetica Neue", system-ui, sans-serif; fill: #a9b8d4; }
      .eyebrow { font: 700 13px "Cascadia Code", "SFMono-Regular", Consolas, monospace; fill: #7f9bd0; letter-spacing: 3.5px; }
      .chip    { font: 600 14px "Segoe UI", system-ui, sans-serif; fill: #cdd9f0; }
      .pill    { font: 800 13px "Cascadia Code", Consolas, monospace; letter-spacing: 1.5px; }
      .mono    { font: 600 11px "Cascadia Code", Consolas, monospace; fill: #7789a8; letter-spacing: 1px; }

      @keyframes drift   { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,18px); } }
      @keyframes drift2  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-14px); } }
      @keyframes draw    { 0%,60% { stroke-dashoffset: 0; } 72% { stroke-dashoffset: 120; } 76% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 0; } }
      @keyframes ring    { 0%,90% { opacity: 0; transform: scale(.85); } 95% { opacity: .9; } 100% { opacity: 0; transform: scale(1.18); } }
      @keyframes sweep   { 0% { transform: translateY(-60px); } 70%,100% { transform: translateY(240px); } }
      @keyframes found   { 0%,38% { opacity: 0; } 44%,90% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes cycleA  { 0%,30% { opacity: 1; } 33.3%,100% { opacity: .25; } }
      @keyframes cycleB  { 0%,30% { opacity: .25; } 33.3%,63% { opacity: 1; } 66.6%,100% { opacity: .25; } }
      @keyframes cycleC  { 0%,63% { opacity: .25; } 66.6%,97% { opacity: 1; } 100% { opacity: .25; } }
      @keyframes blink   { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

      .glowA { animation: drift 14s ease-in-out infinite; transform-box: fill-box; }
      .glowB { animation: drift2 17s ease-in-out infinite; transform-box: fill-box; }
      .tick  { stroke-dasharray: 120; stroke-dashoffset: 0; animation: draw 6s cubic-bezier(.65,0,.35,1) infinite; }
      .ring  { animation: ring 6s ease-out infinite; transform-origin: 140px 190px; }
      .sweep { animation: sweep 4s cubic-bezier(.45,.05,.55,.95) infinite; }
      .found { animation: found 4s ease-in-out infinite; }
      .pa { animation: cycleA 9s ease-in-out infinite; }
      .pb { animation: cycleB 9s ease-in-out infinite; }
      .pc { animation: cycleC 9s ease-in-out infinite; }
      .live { animation: blink 1.6s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .glowA, .glowB, .tick, .ring, .sweep, .found, .pa, .pb, .pc, .live { animation: none; }
        .tick  { stroke-dashoffset: 0; }
        .ring, .sweep { opacity: 0; }
        .found { opacity: 1; }
        .pa, .pb, .pc { opacity: 1; }
      }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <ellipse class="glowA" cx="220" cy="120" rx="360" ry="220" fill="url(#glowA)"/>
  <ellipse class="glowB" cx="1000" cy="300" rx="380" ry="200" fill="url(#glowB)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="19.5" fill="none" stroke="#1e2d47" stroke-width="1.5"/>

  <!-- shield with a tick that draws in -->
  <circle class="ring" cx="140" cy="190" r="92" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <g transform="translate(76,104)">
    <path d="M64 0 L126 24 V78 C126 128 98 162 64 176 C30 162 2 128 2 78 V24 Z" fill="#111b2e" stroke="url(#accent)" stroke-width="3.5"/>
    <path d="M64 14 L114 33 V78 C114 120 91 149 64 162 C37 149 14 120 14 78 V33 Z" fill="none" stroke="#2b3f60" stroke-width="1.5"/>
    <path class="tick" d="M34 90 L56 113 L98 60" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g class="r1"><text class="eyebrow" x="262" y="104">SIH 2026 · PS SIH26228 · TEAM PATRIOTS</text></g>
  <g class="r2"><text class="title" x="258" y="176">TrustVision</text></g>
  <g class="r3"><text class="tag" x="262" y="216">Computer-vision integrity assurance — verified offline.</text></g>

  <!-- what it inspects -->
  <g transform="translate(262,244)"><g class="r4">
    <rect width="96" height="34" rx="17" fill="#111b2e" stroke="#2b3f60"/>
    <text class="chip" x="22" y="22">Dataset</text>
    <rect x="106" width="84" height="34" rx="17" fill="#111b2e" stroke="#2b3f60"/>
    <text class="chip" x="128" y="22">Model</text>
    <rect x="200" width="106" height="34" rx="17" fill="#111b2e" stroke="#2b3f60"/>
    <text class="chip" x="222" y="22">Inference</text>
    <rect x="316" width="74" height="34" rx="17" fill="#111b2e" stroke="#2b3f60"/>
    <text class="chip" x="338" y="22">Shift</text>
    <text class="mono" x="4" y="66">ED25519 · RFC 8785 · SHA-256 · HASH-CHAINED AUDIT LEDGER · AIR-GAPPED</text>
  </g></g>

  <!-- verdict pills, cycling -->
  <g transform="translate(262,330)">
    <g class="pa">
      <rect width="98" height="28" rx="6" fill="#052e22" stroke="#34d399" stroke-opacity=".7"/>
      <text class="pill" x="17" y="19" fill="#34d399">ACCEPT</text>
    </g>
    <g class="pb" transform="translate(108,0)">
      <rect width="98" height="28" rx="6" fill="#2e2405" stroke="#fbbf24" stroke-opacity=".7"/>
      <text class="pill" x="20" y="19" fill="#fbbf24">REVIEW</text>
    </g>
    <g class="pc" transform="translate(216,0)">
      <rect width="128" height="28" rx="6" fill="#2e0a14" stroke="#f43f5e" stroke-opacity=".7"/>
      <text class="pill" x="16" y="19" fill="#f43f5e">QUARANTINE</text>
    </g>
  </g>

  <!-- viewfinder: an image being scanned, a trigger patch is found -->
  <g>
    <rect x="880" y="78" width="236" height="224" rx="10" fill="#0b1220" stroke="#1e2d47"/>
    <g clip-path="url(#frameClip)">
      <!-- a simple scene: sky, road, a sign -->
      <rect x="880" y="78" width="236" height="140" fill="#101a2e"/>
      <path d="M880 302 L960 218 H1036 L1116 302 Z" fill="#162238"/>
      <path d="M998 226 V290" stroke="#2b3f60" stroke-width="3" stroke-dasharray="10 9"/>
      <rect x="1052" y="132" width="5" height="86" fill="#2b3f60"/>
      <polygon points="1038,104 1054,96 1070,104 1070,122 1054,130 1038,122" fill="#7f1d1d" stroke="#f87171" stroke-opacity=".6"/>
      <!-- the trigger patch -->
      <rect x="896" y="270" width="18" height="18" fill="#fbbf24"/>
      <rect x="896" y="270" width="9" height="9" fill="#0b1220"/>
      <rect x="905" y="279" width="9" height="9" fill="#0b1220"/>
      <!-- scan line -->
      <rect class="sweep" x="880" y="78" width="236" height="64" fill="url(#scan)"/>
    </g>
    <!-- detection box on the trigger -->
    <g class="found">
      <rect x="889" y="263" width="32" height="32" rx="3" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
      <rect x="926" y="268" width="128" height="22" rx="4" fill="#2e0a14" stroke="#f43f5e" stroke-opacity=".6"/>
      <text class="pill" x="934" y="283" fill="#fda4af" style="font-size:11px">TRIGGER FOUND</text>
    </g>
    <!-- corner brackets -->
    <path d="M872 98 V70 H900 M1096 70 H1124 V98 M1124 282 V310 H1096 M900 310 H872 V282" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle class="live" cx="884" cy="336" r="4" fill="#34d399"/>
    <text class="mono" x="896" y="340">INSPECTING · SIGNED · LOGGED</text>
  </g>
</svg>
