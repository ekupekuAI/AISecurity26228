<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="The three verdicts: ACCEPT below 30, REVIEW 30 to 69, QUARANTINE 70 and up">
  <defs>
    <linearGradient id="vacc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <linearGradient id="vrev" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="vqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#991b1b"/></linearGradient>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- ACCEPT -->
    <g>
      <rect x="20" y="20" width="280" height="150" rx="16" fill="url(#vacc)"/>
      <rect x="20" y="20" width="280" height="150" rx="16" fill="none" stroke="#bbf7d0" stroke-width="2"><animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
      <path d="M 52 58 l 9 10 l 18 -20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="98" y="66" font-size="27" font-weight="800" fill="#ffffff">ACCEPT</text>
      <text x="40" y="104" font-size="15" font-weight="700" fill="#dcfce7">Risk below 30, no fatal flag</text>
      <text x="40" y="132" font-size="14" fill="#f0fdf4">Cleared for deployment.</text>
      <text x="40" y="152" font-size="14" fill="#f0fdf4">A cryptographic seal is issued.</text>
    </g>
    <!-- REVIEW -->
    <g>
      <rect x="360" y="20" width="280" height="150" rx="16" fill="url(#vrev)"/>
      <rect x="360" y="20" width="280" height="150" rx="16" fill="none" stroke="#fde68a" stroke-width="2"><animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></rect>
      <circle cx="392" cy="60" r="13" fill="none" stroke="#ffffff" stroke-width="4"/><line x1="401" y1="69" x2="410" y2="78" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="424" y="66" font-size="27" font-weight="800" fill="#ffffff">REVIEW</text>
      <text x="380" y="104" font-size="15" font-weight="700" fill="#fef9c3">Risk 30 to 69, or a check skipped</text>
      <text x="380" y="132" font-size="14" fill="#fffbeb">Needs a human analyst.</text>
      <text x="380" y="152" font-size="14" fill="#fffbeb">Restricted use until cleared.</text>
    </g>
    <!-- QUARANTINE -->
    <g>
      <rect x="700" y="20" width="280" height="150" rx="16" fill="url(#vqua)"/>
      <rect x="700" y="20" width="280" height="150" rx="16" fill="none" stroke="#fecaca" stroke-width="2"><animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="1.6s" repeatCount="indefinite"/></rect>
      <circle cx="732" cy="60" r="14" fill="none" stroke="#ffffff" stroke-width="4"/><line x1="723" y1="51" x2="741" y2="69" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="756" y="66" font-size="24" font-weight="800" fill="#ffffff">QUARANTINE</text>
      <text x="720" y="104" font-size="15" font-weight="700" fill="#fee2e2">Risk 70+, or a hard flag fired</text>
      <text x="720" y="132" font-size="14" fill="#fef2f2">Isolated — do not deploy.</text>
      <text x="720" y="152" font-size="14" fill="#fef2f2">Checkpoint revoked, alert raised.</text>
    </g>
  </g>
</svg>
