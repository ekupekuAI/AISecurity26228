<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="How it works: upload, inspect, findings and risk, verdict, signed passport, all recorded in the audit log">
  <defs>
    <linearGradient id="wfa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="wfb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="wfc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="wfd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="wfe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="wfaudit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  </defs>

  <!-- connector line behind the boxes -->
  <line x1="188" y1="70" x2="812" y2="70" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2 6" opacity="0.6"/>

  <!-- flowing dots across the whole row -->
  <circle cy="70" r="4" fill="#38bdf8"><animate attributeName="cx" values="188;812" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cy="70" r="4" fill="#a78bfa"><animate attributeName="cx" values="188;812" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cy="70" r="4" fill="#34d399"><animate attributeName="cx" values="188;812" dur="3.4s" begin="2.2s" repeatCount="indefinite"/></circle>

  <!-- step boxes -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="20" y="40" width="168" height="60" rx="12" fill="url(#wfa)"/>
      <text x="104" y="66" font-size="16" font-weight="800" fill="#ffffff">1 · Upload</text>
      <text x="104" y="86" font-size="12" fill="#dbeafe">dataset or model</text>
    </g>
    <g>
      <rect x="218" y="40" width="168" height="60" rx="12" fill="url(#wfb)"/>
      <text x="302" y="66" font-size="16" font-weight="800" fill="#ffffff">2 · Inspect</text>
      <text x="302" y="86" font-size="12" fill="#e0e7ff">engine runs checks</text>
    </g>
    <g>
      <rect x="416" y="40" width="168" height="60" rx="12" fill="url(#wfc)"/>
      <text x="500" y="66" font-size="16" font-weight="800" fill="#ffffff">3 · Findings</text>
      <text x="500" y="86" font-size="12" fill="#fef3c7">+ a risk score</text>
    </g>
    <g>
      <rect x="614" y="40" width="168" height="60" rx="12" fill="url(#wfd)"/>
      <text x="698" y="66" font-size="16" font-weight="800" fill="#ffffff">4 · Verdict</text>
      <text x="698" y="86" font-size="12" fill="#ede9fe">accept / review / quarantine</text>
    </g>
    <g>
      <rect x="812" y="40" width="168" height="60" rx="12" fill="url(#wfe)"/>
      <text x="896" y="66" font-size="16" font-weight="800" fill="#ffffff">5 · Passport</text>
      <text x="896" y="86" font-size="12" fill="#d1fae5">signed, portable</text>
    </g>
  </g>

  <!-- ticks down into the audit log -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="104" y1="100" x2="104" y2="150"/>
    <line x1="500" y1="100" x2="500" y2="150"/>
    <line x1="896" y1="100" x2="896" y2="150"/>
  </g>

  <!-- audit log bar -->
  <rect x="20" y="150" width="960" height="44" rx="12" fill="url(#wfaudit)"/>
  <rect x="20" y="150" width="960" height="44" rx="12" fill="none" stroke="#64748b" stroke-opacity="0.5"/>
  <text x="46" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Tamper-proof audit log</text>
  <text x="250" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">every step above is hash-chained &amp; Ed25519-signed — nothing can be edited or deleted</text>
  <circle cy="172" r="3.5" fill="#38bdf8"><animate attributeName="cx" values="30;970" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>
