<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="The five engines: dataset, model, inference, distribution shift, and governance with audit">
  <defs>
    <linearGradient id="e1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="e2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <linearGradient id="e3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="e4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7e22ce"/></linearGradient>
    <linearGradient id="e5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- 1 Dataset -->
    <g>
      <rect x="20" y="15" width="180" height="170" rx="14" fill="url(#e1)"/>
      <circle cx="110" cy="50" r="18" fill="#ffffff" fill-opacity="0.16"><animate attributeName="fill-opacity" values="0.1;0.28;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="110" y="57" font-size="20" font-weight="800" fill="#ffffff">1</text>
      <text x="110" y="92" font-size="16" font-weight="800" fill="#ffffff">Dataset</text>
      <text x="110" y="118" font-size="11.5" fill="#ccfbf1">Duplicate floods,</text>
      <text x="110" y="135" font-size="11.5" fill="#ccfbf1">flipped labels, hidden</text>
      <text x="110" y="152" font-size="11.5" fill="#ccfbf1">triggers, OOD, sources</text>
    </g>
    <!-- 2 Model -->
    <g>
      <rect x="215" y="15" width="180" height="170" rx="14" fill="url(#e2)"/>
      <circle cx="305" cy="50" r="18" fill="#ffffff" fill-opacity="0.16"><animate attributeName="fill-opacity" values="0.28;0.1;0.28" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="305" y="57" font-size="20" font-weight="800" fill="#ffffff">2</text>
      <text x="305" y="92" font-size="16" font-weight="800" fill="#ffffff">Model</text>
      <text x="305" y="118" font-size="11.5" fill="#e0e7ff">Audit the pickle safely,</text>
      <text x="305" y="135" font-size="11.5" fill="#e0e7ff">scan weights, catch</text>
      <text x="305" y="152" font-size="11.5" fill="#e0e7ff">backdoors two ways</text>
    </g>
    <!-- 3 Inference -->
    <g>
      <rect x="410" y="15" width="180" height="170" rx="14" fill="url(#e3)"/>
      <circle cx="500" cy="50" r="18" fill="#ffffff" fill-opacity="0.16"><animate attributeName="fill-opacity" values="0.1;0.28;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="500" y="57" font-size="20" font-weight="800" fill="#ffffff">3</text>
      <text x="500" y="92" font-size="16" font-weight="800" fill="#ffffff">Inference</text>
      <text x="500" y="118" font-size="11.5" fill="#e0f2fe">Seal each prediction;</text>
      <text x="500" y="135" font-size="11.5" fill="#e0f2fe">catch tamper, forgery</text>
      <text x="500" y="152" font-size="11.5" fill="#e0f2fe">and replay</text>
    </g>
    <!-- 4 Shift -->
    <g>
      <rect x="605" y="15" width="180" height="170" rx="14" fill="url(#e4)"/>
      <circle cx="695" cy="50" r="18" fill="#ffffff" fill-opacity="0.16"><animate attributeName="fill-opacity" values="0.28;0.1;0.28" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="695" y="57" font-size="20" font-weight="800" fill="#ffffff">4</text>
      <text x="695" y="92" font-size="16" font-weight="800" fill="#ffffff">Shift</text>
      <text x="695" y="118" font-size="11.5" fill="#f3e8ff">Tell real drift (weather,</text>
      <text x="695" y="135" font-size="11.5" fill="#f3e8ff">sensor) apart from</text>
      <text x="695" y="152" font-size="11.5" fill="#f3e8ff">deliberate tampering</text>
    </g>
    <!-- 5 Governance -->
    <g>
      <rect x="800" y="15" width="180" height="170" rx="14" fill="url(#e5)"/>
      <circle cx="890" cy="50" r="18" fill="#ffffff" fill-opacity="0.16"><animate attributeName="fill-opacity" values="0.1;0.28;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
      <text x="890" y="57" font-size="20" font-weight="800" fill="#ffffff">5</text>
      <text x="890" y="92" font-size="15" font-weight="800" fill="#ffffff">Governance</text>
      <text x="890" y="118" font-size="11.5" fill="#fef3c7">Fuse it into a verdict</text>
      <text x="890" y="135" font-size="11.5" fill="#fef3c7">and seal every step</text>
      <text x="890" y="152" font-size="11.5" fill="#fef3c7">in the audit log</text>
    </g>
  </g>
</svg>
